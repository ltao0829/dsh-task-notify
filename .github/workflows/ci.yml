name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: typecheck + test + build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # pnpm version is read from the "packageManager" field in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Pack dry-run (verify publish tarball)
        run: pnpm pack --dry-run

      - name: Package/release metadata check
        run: node scripts/check-package.cjs

      - name: Disposable Profile Verification
        if: matrix.node-version == '22'
        run: |
          npm install -g @deepseek-ai/dsh
          pnpm run verify:profile

      - name: Upload disposable profile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disposable-profile-evidence-node-${{ matrix.node-version }}
          path: docs/verification-evidence.md
          if-no-files-found: ignore
