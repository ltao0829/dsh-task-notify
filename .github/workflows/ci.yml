name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: typecheck + test + build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # pnpm version is read from the "packageManager" field in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Pack dry-run (verify publish tarball)
        run: pnpm pack --dry-run

      - name: Package/release metadata check
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));if(!/^@[a-z0-9-]+\\/[a-z0-9-]+$/.test(p.name))throw new Error('package name must be scoped');for(const k of ['name','version','description','license','repository','files'])if(p[k]===undefined)throw new Error('missing '+k);console.log('metadata OK: '+p.name+'@'+p.version)"
