name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: typecheck + test + build + coverage (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # DSH 0.2's toolchain requires Node 22 or newer, and the shipped
        # desktop runtime embeds Node 24.
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # pnpm version is read from the "packageManager" field in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      # Build before test: tests/bundle.spec.ts asserts the emitted
      # lib/client.js only requires frozen platform modules.
      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      # Runs the same suite with V8 coverage; vitest.config.ts thresholds
      # make a coverage drop fail the build. Must stay after Build — the
      # bundle suite asserts against lib/.
      - name: Coverage
        run: pnpm run coverage

      - name: Upload coverage artifact
        if: always() && matrix.node-version == '24'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov-node-${{ matrix.node-version }}
          path: coverage/lcov.info
          if-no-files-found: error

      - name: Pack dry-run (verify publish tarball)
        run: pnpm pack --dry-run

      - name: Package/release metadata check
        run: node scripts/check-package.cjs

      - name: Disposable Profile Verification
        if: matrix.node-version == '24'
        run: |
          npm install -g @deepseek-ai/dsh@^0.2.0-rc.2
          pnpm run verify:profile

      - name: Upload disposable profile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disposable-profile-evidence-node-${{ matrix.node-version }}
          path: docs/verification-evidence.md
          if-no-files-found: ignore
