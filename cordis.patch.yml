# dsh-task-notify bundle patch: inserts its plugin row into the web profile
# roster. Install with `dsh plugin --profile <name> add <path-or-git-url>`.
#
# The single row mounts BOTH halves: the host half is an inert loader anchor,
# and the browser half (the completion watcher plus its settings page) ships via
# the dsh.client declaration in package.json.
- insert:
    - id: task-notify
      name: '@ltao0829/dsh-task-notify'
